:root{color-scheme:dark;--text:#f3f5ff;--muted:#979fbb;--line:#ffffff1a;--bg:#080b16;--panel:#111729;--accent:#8f80ff;--common:#9aa9ba;--rare:#7b92ff;--epic:#bf83ff;--myth:#ff6ba4;--legend:#ffce6b;--exhibit:#5fe5d5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at top,#172657 0%,#0b1431 27%,#070b18 58%,#060910 100%);overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}button:disabled{cursor:default}button:focus-visible{outline:2px solid #a6a0ff;outline-offset:3px}
#app{position:relative;display:flex;flex-direction:column;max-width:448px;height:100dvh;min-height:0;margin:auto;overflow:hidden;background:linear-gradient(180deg,rgba(50,70,156,.06),transparent 32%)}

.topbar{flex:0 0 auto;min-height:77px;padding:calc(env(safe-area-inset-top) + 11px) 13px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.userbox{display:flex;gap:9px;align-items:center;min-width:0;flex:1}.avatar{display:grid;place-items:center;flex:0 0 41px;height:41px;border-radius:17px;background:linear-gradient(135deg,#8f82ff,#615cf8);font-size:20px;font-weight:900;box-shadow:0 7px 24px #7772ff50}.user-info{min-width:0}.username{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-block;margin-left:5px;width:7px;height:7px;border-radius:50%;background:#3ce6a1;box-shadow:0 0 8px #3ce6a1}.level{color:#b0a2ff;font-weight:800;font-size:11px;margin-top:3px}.xp{height:5px;width:125px;max-width:100%;border-radius:12px;background:#ffffff1b;margin-top:5px;overflow:hidden}.xp i{height:100%;display:block;border-radius:12px;background:linear-gradient(90deg,#7f7bff,#ac7fff)}
.moneybox{padding:9px 11px;border:1px solid var(--line);background:#080c19a0;border-radius:22px;display:flex;align-items:center;gap:8px;min-height:44px}.coin{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#e5e9ff;color:#10162f;font-weight:900}.money{font-size:14px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
#view{position:relative;flex:1;min-height:0;overflow:hidden}.screen{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:7px 13px 12px}.screen::-webkit-scrollbar{display:none}
.screen.enterR{animation:enterR .29s cubic-bezier(.17,.9,.24,1)}.screen.enterL{animation:enterL .29s cubic-bezier(.17,.9,.24,1)}@keyframes enterR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}@keyframes enterL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.home-screen{display:flex;flex-direction:column;gap:10px;min-height:100%;overflow-y:auto}
.hero{flex:1 1 340px;min-height:345px;max-height:570px;border:1px solid #8176ee90;border-radius:29px;box-shadow:0 0 0 1px #7669f41f inset,0 0 38px #6264e82b,0 15px 40px #0008;background:linear-gradient(145deg,#151b34 0%,#101629 48%,#090e1a 100%);padding:15px;display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate}
.hero:before{content:"";position:absolute;inset:18% -25% auto;height:54%;background:radial-gradient(ellipse,rgba(100,94,226,.22),transparent 67%);z-index:-1;pointer-events:none}.hero:after{content:"";position:absolute;left:9%;right:9%;height:26px;bottom:32px;background:radial-gradient(ellipse,#7182d63c,transparent 70%);filter:blur(9px);z-index:-1}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:68px}.hero-heading{min-width:0}.micro{color:#9fa9ca;font-size:10px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.hero-title{margin:5px 0 0;line-height:1.04;letter-spacing:-.55px;font-weight:950;font-size:clamp(20px,5.1vw,26px);overflow-wrap:anywhere}.value-col{text-align:right;white-space:nowrap;border-left:1px solid #ffffff25;padding-left:11px}.value-col small{font-size:9px;color:#b4bfd8;display:block;font-weight:800;letter-spacing:.7px}.value-col strong{display:block;margin-top:6px;font-size:clamp(17px,4.7vw,22px);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;gap:7px;align-items:center;background:color-mix(in srgb,var(--rar) 12%,#0c1225);border:1px solid color-mix(in srgb,var(--rar) 48%,transparent);color:var(--rar);font-size:11px;font-weight:900;border-radius:99px;padding:6px 10px;margin-top:9px}.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--rar)}
.art{flex:1;min-height:145px;display:grid;place-items:center;position:relative;overflow:hidden}.car-img{width:111%;max-width:410px;max-height:min(31vh,278px);object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 19px 21px #0009)}.case-img{width:min(91%,310px);max-height:min(27vh,260px);object-fit:contain;filter:drop-shadow(0 14px 24px #080b22)}
.hero-meta{display:flex;align-items:end;justify-content:space-between;gap:8px;font-size:12px;line-height:1.2;margin-top:3px}.hero-meta strong{display:block;font-size:14px;margin-top:4px}.hero-meta small{font-size:10px;color:#9ba6c1;font-weight:800;letter-spacing:.6px}.hero-meta .right-note{text-align:right;color:#b2bdd5;max-width:150px}
.reveal .car-img{animation:arrive .72s cubic-bezier(.18,.89,.18,1) both}.lightburst{position:absolute;width:250px;height:250px;opacity:0;background:radial-gradient(circle,color-mix(in srgb,var(--rar) 30%,transparent),transparent 66%);border-radius:50%;filter:blur(11px);z-index:1}.reveal .lightburst{animation:burst .8s ease-out both}@keyframes arrive{0%{opacity:0;transform:translateY(18px) scale(.90);filter:blur(5px)}50%{opacity:1;transform:translateY(-4px) scale(1.04);filter:blur(0)}100%{opacity:1;transform:none;filter:drop-shadow(0 19px 21px #0009)}}@keyframes burst{0%{opacity:0;transform:scale(.7)}38%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.brand-title{font-size:11px;letter-spacing:2px;font-weight:900;color:#adb9e6;margin-bottom:8px}.brand-stamp{font-size:clamp(29px,9vw,43px);font-weight:1000;letter-spacing:1px;text-transform:uppercase;text-align:center;animation:brandPop .46s cubic-bezier(.2,.9,.2,1) both;text-shadow:0 0 36px #9595ff66;max-width:100%;overflow-wrap:anywhere}.brand-stage{text-align:center}.brand-stage small{display:block;margin-top:10px;color:#b4c0df;font-size:12px;font-weight:750}@keyframes brandPop{from{opacity:0;transform:translateY(10px) scale(.89);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.reel-shell{width:100%;height:212px;overflow:hidden;position:relative;display:flex;align-items:center}.reel-shell:before,.reel-shell:after{content:"";position:absolute;top:0;bottom:0;width:34px;z-index:3;pointer-events:none}.reel-shell:before{left:0;background:linear-gradient(90deg,#10162a,transparent)}.reel-shell:after{right:0;background:linear-gradient(270deg,#10162a,transparent)}.reel-pointer{position:absolute;z-index:4;left:50%;top:6px;bottom:6px;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,#c7caff,transparent);box-shadow:0 0 11px #91a8ff}.reel-track{display:flex;gap:9px;transform:translateX(0);will-change:transform}.reel-track.spinning{transition:transform 3.15s cubic-bezier(.08,.82,.12,1)}.reel-cell{flex:0 0 117px;height:166px;border-radius:20px;border:1px solid #ffffff21;background:linear-gradient(160deg,#202743,#0e1526);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;padding:15px 8px 13px;text-align:center;box-shadow:0 10px 28px #0004}.reel-mark{width:58px;height:58px;border-radius:20px;background:color-mix(in srgb,var(--rar) 16%,#11182c);border:1px solid color-mix(in srgb,var(--rar) 35%,transparent);display:grid;place-items:center;color:var(--rar);font-size:20px;font-weight:1000;letter-spacing:-1px}.reel-brand{font-size:12px;font-weight:950;text-transform:uppercase;overflow-wrap:anywhere}.reel-model{font-size:10px;color:#a5b2d3;line-height:1.16}
.actions{flex:0 0 auto;display:grid;gap:8px}.primary,.secondary{width:100%;border:0;min-height:53px;border-radius:21px;font-size:16px;font-weight:900}.primary{background:linear-gradient(112deg,#676cfc,#a16dff);box-shadow:0 10px 26px #7168ee54}.primary:disabled{background:linear-gradient(115deg,#404962,#616a80);box-shadow:none}.secondary{border:1px solid #ffffff24;background:#ffffff08}.choices{flex:0 0 auto;display:grid;grid-template-columns:1.45fr 1fr;gap:9px}.chooser{border:1px solid #ffffff1b;background:linear-gradient(145deg,#172037,#0e1423);border-radius:20px;min-height:70px;padding:10px 11px;display:flex;align-items:center;text-align:left;gap:9px;min-width:0}.chooser-icon{width:35px;height:35px;border-radius:13px;background:#ffffff0e;display:grid;place-items:center;flex:0 0 35px}.chooser-icon img{width:32px;height:32px;object-fit:contain}.chooser-icon svg{width:20px;height:20px}.chooser-copy{min-width:0}.chooser-copy small{color:#a1abca;font-size:10px;font-weight:800;display:block}.chooser-copy strong{font-size:14px;font-weight:900;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chooser-copy em{color:#b5bfd9;font-size:11px;display:block;margin-top:3px;font-style:normal}
.nav{margin:0 10px calc(8px + env(safe-area-inset-bottom));padding:6px;flex:0 0 auto;position:relative;z-index:4;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#0a0e19e8;border:1px solid #ffffff16;border-radius:25px;box-shadow:0 -4px 24px #0005;backdrop-filter:blur(15px)}.navbtn{min-height:57px;border:0;background:none;border-radius:18px;color:#9ba5bf;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:10px;font-weight:850}.navbtn svg{width:20px;height:20px}.navbtn.active{color:#fff;background:#ffffff0f}.navbtn.active svg{color:#a092ff}

.overlay{position:fixed;inset:0;z-index:20;pointer-events:none}.sheetwrap,.dialogwrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;background:#030610b9;padding:10px;pointer-events:auto}.sheet,.dialog{width:min(430px,100%);border:1px solid #ffffff25;background:linear-gradient(170deg,#1b233a,#0e1523);border-radius:25px;padding:14px 13px calc(14px + env(safe-area-inset-bottom));box-shadow:0 15px 45px #0008;animation:rise .25s ease-out}.dialogwrap{align-items:center}.dialog{padding:18px}.handle{background:#ffffff35;height:4px;width:47px;border-radius:10px;margin:0 auto 12px}.sheethead{display:flex;align-items:center;justify-content:space-between;gap:9px}.sheethead h3,.dialog h3{margin:0;font-size:20px}.close{border:1px solid #ffffff28;background:#ffffff0c;border-radius:13px;width:33px;height:33px}.sheetlist{display:grid;gap:7px;margin-top:11px;max-height:54vh;overflow:auto}.sheetitem{border:1px solid #ffffff1d;background:#ffffff08;border-radius:16px;min-height:55px;padding:11px 13px;text-align:left;font-weight:850}.sheetitem.on{border-color:#a39bff;background:#9482ff22}.sheetitem small{display:block;margin-top:4px;font-size:11px;color:#aebbd9;font-weight:650}.dialog p{font-size:13px;line-height:1.5;color:#b1bfd5}.dialogact{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.dialogact button{background:#ffffff0c;border:1px solid #ffffff20;border-radius:14px;min-height:44px;font-weight:800}.dialogact button.yes{background:#756cff}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-height:730px){.hero{min-height:280px}.topbar{min-height:70px;padding-top:calc(env(safe-area-inset-top) + 7px)}.home-screen{gap:8px}.art{min-height:124px}.reel-shell{height:180px}.reel-cell{height:148px}}
@media(max-width:354px){.hero-title{font-size:20px}.money{font-size:12px}.chooser{padding:9px 7px}.chooser-icon{width:29px;flex-basis:29px}.chooser-copy strong{font-size:12px}}
@media(min-width:449px){#app{border-inline:1px solid #243155}}
@media(prefers-reduced-motion:reduce){.screen,.reveal .car-img,.reveal .lightburst,.brand-stamp{animation-duration:.01ms!important}.reel-track.spinning{transition-duration:.1s!important}}
</style>

function tone(f,d=.08,volume=.022){if(!S.sound)return;try{const ctx=tone.ctx||(tone.ctx=new(window.AudioContext||window.webkitAudioContext)());const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.value=volume;osc.connect(gain);gain.connect(ctx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);osc.stop(ctx.currentTime+d)}catch(e){}}
const melody=notes=>notes.forEach(([f,d,at])=>setTimeout(()=>tone(f,d),at));
function celebrate(r){if(r==='exhibit'){vib('heavy');setTimeout(()=>vib('rigid'),130);notify('success');melody([[690,.11,0],[950,.11,130],[1240,.13,290],[1520,.15,440]])}else if(r==='legend'){vib('rigid');notify('success');melody([[620,.12,0],[820,.11,130],[1100,.15,270]])}else if(r==='myth'){vib('heavy');notify('success');melody([[680,.10,0],[930,.14,150]])}else{vib('medium');tone(r==='epic'?850:620,.12)}}
function poolFor(c){return CAR_LIBRARY.filter(car=>Number(c.odds[car.rarity])>0)}
function pickWinner(c){const categories=[...new Set(poolFor(c).map(x=>x.rarity))];const total=categories.reduce((sum,r)=>sum+c.odds[r],0);if(!total)return null;let random=Math.random()*total,chosen=categories.at(-1);for(const r of categories){random-=c.odds[r];if(random<0){chosen=r;break}}const models=CAR_LIBRARY.filter(x=>x.rarity===chosen);return models[Math.floor(Math.random()*models.length)]}
function makeInstance(base){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,11),carId:base.id,price:base.price}}
function buildReel(c,win){const pool=poolFor(c);const seq=[];for(let i=0;i<27;i++){seq.push(pool[Math.floor(Math.random()*pool.length)])}const target=20;seq[target]=win;return{seq,target,brand:win.brand}}
function header(){const xpNeed=Math.max(100,S.level*80);return `<div class="userbox"><div class="avatar">${esc((S.player||'И').slice(0,1).toUpperCase())}</div><div class="user-info"><div class="username">${esc(S.player)}<i class="status"></i></div><div class="level">Уровень ${S.level}</div><div class="xp"><i style="width:${Math.min(100,S.xp/xpNeed*100)}%"></i></div></div></div><div class="moneybox"><div class="coin">₽</div><div class="money">${money(S.balance)}</div></div>`}
function nav(){return [['home','Главная','home'],['garage','Парковка','garage'],['profile','Профиль','profile']].map(([key,name,ico])=>`<button class="navbtn ${tab===key?'active':''}" data-tab="${key}">${icon(ico)}<span>${name}</span></button>`).join('')}
function classAnim(){return ({home:0,garage:1,profile:2}[tab]>=({home:0,garage:1,profile:2}[previousTab]))?'enterR':'enterL'}
function rarityPill(r){return `<div class="badge" style="--rar:${colors[r]||colors.common}"><span class="dot"></span>${rareNames[r]||'Обычная'}</div>`}
function stage(){const cs=caseById(S.currentCase),pending=carData(S.pending);const active=phase==='rolling'||phase==='brand';const full=Boolean(pending)&&!active;const title=full?pending.name:cs.name;const amount=full?pending.price:cs.price;let art='';let kicker='';let label='';let foot='';
 if(phase==='rolling'&&reel){
   kicker='РУЛЕТКА АВТОМОБИЛЕЙ';label='Марка → модель';foot='Одна прокрутка, один результат';
   art=`<div class="reel-shell" id="reelWrap"><div class="reel-pointer"></div><div id="reelTrack" class="reel-track">${reel.seq.map(b=>`<div class="reel-cell" style="--rar:${colors[b.rarity]}"><div class="reel-mark">${esc(b.brand.slice(0,2).toUpperCase())}</div><div class="reel-brand">${esc(b.brand)}</div><div class="reel-model">${esc(b.name.replace(b.brand,'').trim())}</div></div>`).join('')}</div></div>`;
 }else if(phase==='brand'&&pending){
   kicker='ВЫПАЛА МАРКА';label=pending.brand;foot='Сейчас откроется модель';
   art=`<div class="brand-stage"><div class="brand-title">МАРКА ОПРЕДЕЛЕНА</div><div class="brand-stamp">${esc(pending.brand)}</div><small>Открываем конкретную модель...</small></div>`;
 }else if(full){
   kicker='ТВОЯ НАГРАДА';label=pending.brand;foot='Оставь в гараже или продай';
   art=`<div class="art ${Date.now()<revealedAt+1200?'reveal':''}" style="--rar:${colors[pending.rarity]}"><div class="lightburst"></div><img class="car-img" src="${imgFor(pending)}" alt="${esc(pending.name)}"></div>`;
 }else{
   kicker='ВЫБРАН КОНТЕЙНЕР';label='Марка → модель';foot='Узнай, какой автомобиль получишь';
   art=`<img class="case-img" src="${imageUrls.crate}" alt="Контейнер ${esc(cs.name)}">`;
 }
 return `<section class="hero"><div class="hero-head"><div class="hero-heading"><div class="micro">${kicker}</div><h1 class="hero-title">${esc(title)}</h1>${full?rarityPill(pending.rarity):`<div class="badge" style="--rar:#ac9eff"><span class="dot"></span>${phase==='rolling'?'Прокрутка':phase==='brand'?'Марка определена':esc(cs.name)}</div>`}</div><div class="value-col"><small>${full?'СТОИМОСТЬ':'ЦЕНА'}</small><strong>${money(amount)}</strong></div></div><div class="art">${art}</div><div class="hero-meta"><div><small>${full?'МАРКА':active?'ПРОЦЕСС':'МЕХАНИКА'}</small><strong>${esc(label)}</strong></div><div class="right-note">${foot}</div></div></section>`}
function home(){const cs=caseById(S.currentCase),pending=Boolean(S.pending),active=phase==='rolling'||phase==='brand';return `<section class="screen home-screen ${classAnim()}">${stage()}<div class="actions">${active?`<button class="primary" disabled>${phase==='brand'?'Открываем модель...':'Крутится рулетка...'}</button>`:pending?`<button class="primary" data-act="keep">На парковку</button><button class="secondary" data-act="sellPending">Продать за ${money(S.pending.price)}</button>`:`<button class="primary" data-act="open">Открыть контейнер · ${money(cs.price)}</button>`}</div><div class="choices"><button class="chooser" data-act="cases"><span class="chooser-icon"><img src="${imageUrls.crate}" alt=""></span><span class="chooser-copy"><small>КОНТЕЙНЕР</small><strong>${esc(cs.name)}</strong><em>${money(cs.price)}</em></span></button><button class="chooser" data-act="odds"><span class="chooser-icon">${icon('spark')}</span><span class="chooser-copy"><small>ДРОП</small><strong>Шансы</strong><em>Марки и модели</em></span></button></div></section>`}
function orderedGarage(){const arr=S.garage.slice();if(S.sort==='exp')arr.sort((a,b)=>b.price-a.price);else if(S.sort==='cheap')arr.sort((a,b)=>a.price-b.price);else if(S.sort==='rar')arr.sort((a,b)=>rareOrder.indexOf(CAR_BY_ID[b.carId]?.rarity)-rareOrder.indexOf(CAR_BY_ID[a.carId]?.rarity));return arr}
function garageItem(item){const c=carData(item);if(!c)return '';return `<article class="garage-item"><div class="garage-head"><div><h3>${esc(c.name)}</h3>${rarityPill(c.rarity)}</div><div class="garage-price">${money(c.price)}</div></div><div class="garage-art"><img loading="lazy" src="${imgFor(c)}" alt="${esc(c.name)}"></div><button class="sellbtn" data-act="sellCar" data-id="${esc(item.id)}">Продать</button></article>`}
const sortNames={new:'Сначала новые',exp:'Сначала дорогие',cheap:'Сначала дешёвые',rar:'По редкости'};
function garage(){return `<section class="screen ${classAnim()}"><div class="card"><h2>Парковка</h2><p>Твои автомобили. Изображения, сортировка и продажа сохранены.</p><div class="stats"><div class="stat"><small>МАШИНЫ</small><strong>${S.garage.length}</strong></div><div class="stat"><small>СТОИМОСТЬ ГАРАЖА</small><strong>${money(S.garage.reduce((a,c)=>a+c.price,0))}</strong></div></div><div class="garage-tools"><button class="tinybtn" data-act="sort">${sortNames[S.sort]} ▾</button>${S.garage.length?`<button class="tinybtn" data-act="sellAll">Продать всё</button>`:''}</div>${S.garage.length?`<div class="garage-list">${orderedGarage().map(garageItem).join('')}</div>`:`<div class="empty">Пока пусто. Открой контейнер и отправь первую машину в гараж.</div>`}</div></section>`}
function profile(){const total=S.garage.reduce((a,c)=>a+c.price,0),capital=S.balance+total;return `<section class="screen ${classAnim()}"><div class="card"><h2>Профиль</h2><p>Прогресс и сохранения — без миссий и лишних разделов.</p><div class="stats"><div class="stat"><small>БАЛАНС</small><strong>${money(S.balance)}</strong></div><div class="stat"><small>УРОВЕНЬ</small><strong>${S.level}</strong></div><div class="stat"><small>ОТКРЫТО</small><strong>${S.opened}</strong></div><div class="stat"><small>ПРОДАНО</small><strong>${S.sold}</strong></div><div class="stat"><small>ПОСЛЕДНИЙ ДРОП</small><strong style="font-size:13px">${esc(S.lastDrop||'—')}</strong></div><div class="stat"><small>КАПИТАЛ</small><strong>${money(capital)}</strong></div></div><div style="margin-top:16px"><div class="row"><strong>Путь к миллиону</strong><small>${Math.min(100,Math.round(capital/1000000*100))}%</small></div><div class="progress"><i style="width:${Math.min(100,capital/1000000*100)}%"></i></div></div><div style="margin-top:15px"><button class="toolrow" data-act="sound">Звук<small>${S.sound?'Включён':'Выключен'}</small></button><button class="toolrow" data-act="export">Экспорт сохранения<small>Сохранить JSON перед сменой версии</small></button><button class="toolrow" data-act="import">Импорт сохранения<small>Поддерживаются предыдущие версии</small></button><button class="toolrow" data-act="reset">Сброс игры<small>Удалить сохранённый прогресс</small></button></div></div></section>`}
function render(animateNav=false){$('#header').innerHTML=header();$('#nav').innerHTML=nav();$('#view').innerHTML=tab==='home'?home():tab==='garage'?garage():profile()}
function launchReel(){const track=$('#reelTrack'),wrap=$('#reelWrap');if(!track||!wrap||!reel)return;const first=track.querySelector('.reel-cell');if(!first)return;const gap=9,cell=first.getBoundingClientRect().width+gap;const x=-(reel.target*cell-(wrap.clientWidth-first.getBoundingClientRect().width)/2);requestAnimationFrame(()=>{track.classList.add('spinning');requestAnimationFrame(()=>track.style.transform=`translate3d(${x}px,0,0)`)})}
function addXp(n){S.xp+=n;while(S.xp>=Math.max(100,S.level*80)){S.xp-=Math.max(100,S.level*80);S.level++;S.balance+=S.level*1000}}
function completeRoll(token){if(token!==animationToken||!S.pending)return;clearTimeout(openTimer);phase='brand';reel=null;render();vib('medium');tone(650,.10);brandTimer=setTimeout(()=>{if(token!==animationToken||!S.pending)return;phase='idle';revealedAt=Date.now();const c=carData(S.pending);S.transaction=null;save();render();celebrate(c.rarity)},700)}
function openCase(){if(phase!=='idle'||S.pending)return;const c=caseById(S.currentCase);if(S.balance<c.price){toast('Недостаточно средств');return}const winner=pickWinner(c);if(!winner){toast('В этом контейнере нет машин');return}const prize=makeInstance(winner);
 // Atomic gameplay step: spend currency and store the exact prize in one small save.
 const previous=S;const next={...S,balance:S.balance-c.price,opened:S.opened+1,pending:prize,lastDrop:winner.name,got:{...S.got,[winner.rarity]:(S.got[winner.rarity]||0)+1},transaction:{id:prize.id,caseId:c.id,state:'spinning'}};
 S=next;addXp(18+CASES.findIndex(x=>x.id===c.id)*9);if(!save()){S=previous;toast('Не удалось сохранить награду. Проверь память браузера.');return}
 animationToken++;const token=animationToken;phase='rolling';reel=buildReel(c,winner);render();launchReel();vib('light');tone(380,.06);
 openTimer=setTimeout(()=>completeRoll(token),3280);
}
function keep(){if(!S.pending||phase!=='idle')return;const name=carData(S.pending)?.name;S.garage.unshift(S.pending);S.pending=null;S.transaction=null;if(!save()){S.pending=S.garage.shift();toast('Не удалось сохранить парковку');return}render();toast(name+' на парковке')}
function sellPending(){if(!S.pending||phase!=='idle')return;const old=S.pending;S.balance+=old.price;S.sold++;S.pending=null;S.transaction=null;if(!save()){S.balance-=old.price;S.sold--;S.pending=old;toast('Сохранение недоступно');return}render();toast('Продано за '+money(old.price))}
function sellCar(id){const item=S.garage.find(x=>x.id===id);if(!item)return;dialog('Продать автомобиль?',`Продать ${carData(item).name} за ${money(item.price)}?`,()=>{S.garage=S.garage.filter(c=>c.id!==id);S.balance+=item.price;S.sold++;save();render();toast('Продано за '+money(item.price))})}
function sellAll(){if(!S.garage.length)return;const sum=S.garage.reduce((a,c)=>a+c.price,0);dialog('Продать все машины?',`Весь гараж будет продан за ${money(sum)}.`,()=>{S.balance+=sum;S.sold+=S.garage.length;S.garage=[];save();render();toast('Парковка продана')})}
function sheet(title,items,selected,action){$('#overlay').innerHTML=`<div class="sheetwrap" data-outside="1"><section class="sheet"><div class="handle"></div><div class="sheethead"><h3>${title}</h3><button class="close" data-act="close">×</button></div><div class="sheetlist">${items.map(o=>`<button class="sheetitem ${o.value===selected?'on':''}" data-act="${action}" data-id="${esc(o.value)}">${esc(o.title)}<small>${esc(o.description||'')}</small></button>`).join('')}</div></section></div>`}
function odds(){const cs=caseById(S.currentCase);sheet('Шансы · '+cs.name,Object.entries(cs.odds).map(([k,n])=>({value:k,title:rareNames[k]+' — '+n+'%',description:CAR_LIBRARY.filter(c=>c.rarity===k).map(c=>c.brand+' '+c.name.replace(c.brand,'').trim()).join(' · ')})),'none','none')}
function dialog(title,message,callback){dialogCallback=callback;$('#overlay').innerHTML=`<div class="dialogwrap" data-outside="1"><div class="dialog"><h3>${title}</h3><p>${message}</p><div class="dialogact"><button data-act="close">Отмена</button><button class="yes" data-act="confirm">Подтвердить</button></div></div></div>`}
function closeOverlay(){$('#overlay').innerHTML='';dialogCallback=null}
function exportSave(){const blob=new Blob([JSON.stringify({version:4,save:S},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='drive-drop-brand-reveal-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function reset(){dialog('Начать заново?','Удалится весь игровой прогресс на этом устройстве.',()=>{clearTimeout(openTimer);clearTimeout(brandTimer);animationToken++;S=normalize(null);tab='home';previousTab='home';phase='idle';reel=null;save();render()})}
document.addEventListener('click',e=>{const outside=e.target.closest('[data-outside]');if(outside&&e.target===outside){closeOverlay();return}const b=e.target.closest('[data-tab],[data-act]');if(!b||b.disabled)return;const target=b.dataset.tab;if(target){if(tab===target)return;previousTab=tab;tab=target;render();vib('light');return}const act=b.dataset.act,id=b.dataset.id;switch(act){case'open':openCase();break;case'keep':keep();break;case'sellPending':sellPending();break;case'cases':sheet('Выбор контейнера',CASES.map(c=>({value:c.id,title:c.name+' · '+money(c.price),description:Object.entries(c.odds).map(([k,v])=>rareNames[k]+' '+v+'%').join(' · ')})),S.currentCase,'setCase');break;case'setCase':if(phase==='idle'&&!S.pending){S.currentCase=id;save();closeOverlay();render()}else toast('Заверши текущее открытие');break;case'odds':odds();break;case'none':break;case'sort':sheet('Сортировка',Object.entries(sortNames).map(([value,title])=>({value,title})),S.sort,'setSort');break;case'setSort':S.sort=id;save();closeOverlay();render();break;case'sellCar':sellCar(id);break;case'sellAll':sellAll();break;case'sound':S.sound=!S.sound;save();render();break;case'export':exportSave();break;case'import':$('#importInput').click();break;case'reset':reset();break;case'close':closeOverlay();break;case'confirm':{const cb=dialogCallback;closeOverlay();cb?.();break}}});
$('#importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const raw=JSON.parse(await file.text());const data=raw.save||raw;if(typeof data.balance!=='number'||!Array.isArray(data.garage))throw Error('Invalid');const next=normalize(data),old=S;S=next;if(!save()){S=old;toast('Не удалось сохранить импорт');return}clearTimeout(openTimer);clearTimeout(brandTimer);animationToken++;phase='idle';reel=null;tab='profile';render();toast('Сохранение загружено')}catch(e){toast('Файл сохранения не распознан')}});
render();
})();
</script>
</body>
</html>
